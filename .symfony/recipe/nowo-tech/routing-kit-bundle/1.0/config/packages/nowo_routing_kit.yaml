# Default configuration for RoutingKitBundle (Flex recipe)
nowo_routing_kit:
    enabled: true
    default_locale: en
    locales: [en]
    panel:
        enabled: true
        path_prefix: '/_routing'
        role: ROLE_ADMIN
        allow_controller_override: false
        max_definitions: 500
        reject_conflicts: true
    auto_invalidate_cache: true
    seo_kit_bridge: true
