# Default configuration for RoutingKitBundle (Flex recipe)
nowo_routing_kit:
    enabled: true
    default_locale: en
    locales: [en]
    panel:
        allow_controller_override: false
        max_definitions: 500
        list_page_size: 50
        reject_conflicts: true
    # Admin panel on the UiKit page contract: layout (nowo_ui_kit.layouts.admin) and theme come from nowo_ui_kit.
    web_ui:
        enabled: true
        path_prefix: '/_routing'
        # layout_template: ~   # null = nowo_ui_kit.layouts.admin
    security:
        access_roles: [ROLE_ADMIN]
        allow_unauthenticated: false
    auto_invalidate_cache: true
    seo_kit_bridge: true

when@prod:
    nowo_routing_kit:
        panel:
            allow_controller_override: false
        security:
            access_roles: [ROLE_ADMIN]
            allow_unauthenticated: false
