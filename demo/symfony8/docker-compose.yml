name: routing-kit-bundle-demo-symfony-8
services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: routing-kit-demo-symfony8-php
    working_dir: /app
    ports:
      - "${PORT:-8058}:80"
    volumes:
      - .:/app
      - ../..:/var/routing-kit-bundle
      - ./docker/frankenphp/Caddyfile.dev:/etc/frankenphp/Caddyfile.dev
      - ./docker/php-dev.ini:/usr/local/etc/php/conf.d/99-dev.ini:ro
      - composer-cache:/root/.composer/cache
    environment:
      - COMPOSER_ALLOW_SUPERUSER=1
      - APP_ENV=dev
      - APP_DEBUG=1
      - APP_SECRET=${APP_SECRET:-CHANGE_ME_LOCAL_SECRET_AT_LEAST_32_CHARS}
      - FRANKENPHP_MODE=${FRANKENPHP_MODE:-worker}
      - DEFAULT_URI=http://localhost:${PORT:-8058}
    # Mitigate Docker/WSL DNS failures resolving repo.packagist.org (composer curl error 6).
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - routing-kit-demo-network

volumes:
  composer-cache:
    driver: local

networks:
  routing-kit-demo-network:
    driver: bridge
