# Default demo configuration for RoutingKitBundle
nowo_routing_kit:
    enabled: true
    default_locale: en
    locales: [en, es]
    storage:
        paths_file: '%kernel.project_dir%/var/routing_kit/paths.json'
    discovery:
        scan_dirs:
            - '%kernel.project_dir%/src/Controller'
    panel:
        allow_controller_override: false
        max_definitions: 500
        list_page_size: 50
        reject_conflicts: true
        # Dedicated HMAC key (≥32 chars). Do not reuse in production.
        export_signing_key: 'demo-only-routing-kit-hmac-key-32b!!'
    # Admin panel on the UiKit page contract (REQ-UI-003): layout and theme come from nowo_ui_kit.
    web_ui:
        enabled: true
        path_prefix: '/_routing'
        # layout_template: null → nowo_ui_kit.layouts.admin (templates/layouts/admin.html.twig)
        # import_display: modal (default) — the signed JSON import opens in a dialog from the "Import" page action
    # Demo has no Security Bundle — the in-bundle role gate is disabled.
    # UNSAFE for public networks. Production: security.access_roles + access_control.
    security:
        access_roles: []
        allow_unauthenticated: true
    redirects:
        canonical_enabled: true
        canonical_status: 301
        root_enabled: false
        root_canonical_style: without_prefix
        root_home_path: /
    # Operator URL redirects (opt-in): panel section at /_routing/redirects.
    url_redirects:
        enabled: true
        file: '%kernel.project_dir%/var/routing_kit/redirects.json'
    auto_invalidate_cache: true
    register_unprefixed_default: true
    seo_kit_bridge: true
