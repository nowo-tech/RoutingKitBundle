# REQ-TEST-011 — Demo smoke: boot the FrankenPHP demo and assert HTTP 200 (make demo-smoke → demo release-verify).
# Not a required check: it runs weekly, on v* tags, on demand, and on pull requests that touch the demo or this workflow.
name: Demo smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
    paths:
      - 'demo/**'
      - '.github/workflows/demo-smoke.yml'

jobs:
  demo-smoke:
    name: Demo release-verify (HTTP 200)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Compose
        run: docker compose version

      - name: Run demo smoke (REQ-TEST-011)
        run: make demo-smoke
