<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edit path</title>
<link rel="stylesheet" href="/assets/nowo_ui_kit/css/nowo-ui.css">
<link rel="stylesheet" href="/assets/nowo_ui_kit/css/nowo-ui.css">
</head>
<body class="nowo-ui-page nowo-ui-routing-kit-panel" data-css-framework="custom" data-icon-set="none">
<div class="nowo-ui-container">
<header class="nowo-ui-page-header">
<h1>Edit path</h1>
<p class="nowo-ui-muted muted">Define path as /about or /blog/{slug}. Do not include {_locale}.</p>
</header>
<main>
<form-start name="route_path_definition" options="{&quot;attr&quot;:{&quot;class&quot;:&quot;nowo-ui-form&quot;}}">
<form-row name="route_name">
<form-row name="locale">
<form-row name="path">
<div class="nowo-ui-actions actions">
<button type="submit" class="nowo-ui-btn nowo-ui-btn--primary nowo-ui-action-save">Save</button>
<a class="nowo-ui-btn nowo-ui-btn--secondary nowo-ui-action-cancel" href="/_routing-kit/">Cancel</a>
</div>
<form-end name="route_path_definition">
</main>
</div>
</body>
</html>
