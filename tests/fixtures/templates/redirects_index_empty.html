<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>URL redirects</title>
<link rel="stylesheet" href="/assets/nowo_ui_kit/css/nowo-ui.css">
<link rel="stylesheet" href="/assets/nowo_ui_kit/css/nowo-ui.css">
</head>
<body class="nowo-ui-page nowo-ui-routing-kit-panel" data-css-framework="custom" data-icon-set="none">
<div class="nowo-ui-container">
<header class="nowo-ui-page-header">
<h1>URL redirects</h1>
<p class="nowo-ui-muted muted">Send retired public URLs (old site, renamed pages) to their new address without a deploy. Applied before routing, for GET and HEAD.</p>
<div class="nowo-ui-actions actions">
<a class="nowo-ui-btn nowo-ui-btn--primary nowo-ui-action-create" href="/_routing-kit/redirects/new" data-testid="redirect-new">New redirect</a>
</div>
</header>
<main>
<p class="nowo-ui-muted muted">0 redirect(s)</p>
<div class="nowo-ui-table-wrap">
<table class="nowo-ui-table" data-testid="redirect-table">
<thead>
<tr>
<th>Old path</th>
<th>Target</th>
<th>Status</th>
<th>Enabled</th>
<th>Hits</th>
<th>Note</th>
<th><span class="visually-hidden sr-only">Actions</span></th>
</tr>
</thead>
<tbody>
<tr><td colspan="7">No redirects yet.</td></tr>
</tbody>
</table>
</div>
</main>
</div>
</body>
</html>
