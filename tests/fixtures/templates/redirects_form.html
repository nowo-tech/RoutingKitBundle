<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New redirect</title>
<link rel="stylesheet" href="/assets/nowo_ui_kit/css/nowo-ui.css">
<link rel="stylesheet" href="/assets/nowo_ui_kit/css/nowo-ui.css">
</head>
<body class="nowo-ui-page nowo-ui-routing-kit-panel" data-css-framework="custom" data-icon-set="none">
<div class="nowo-ui-container">
<header class="nowo-ui-page-header">
<h1>New redirect</h1>
<p class="nowo-ui-muted muted">Use 301 for permanent moves. Paths are case-sensitive; the query string of the request is kept for internal targets.</p>
</header>
<main>
<form-start name="url_redirect" options="{&quot;attr&quot;:{&quot;class&quot;:&quot;nowo-ui-form&quot;,&quot;data-testid&quot;:&quot;redirect-form&quot;}}">
<form-errors name="url_redirect">
<form-row name="sourcePath">
<form-row name="targetUrl">
<div class="nowo-ui-actions actions">
<button type="submit" class="nowo-ui-btn nowo-ui-btn--primary nowo-ui-action-save">Save</button>
<a class="nowo-ui-btn nowo-ui-btn--secondary nowo-ui-action-cancel" href="/_routing-kit/redirects">Cancel</a>
</div>
<form-end name="url_redirect">
</main>
</div>
</body>
</html>
