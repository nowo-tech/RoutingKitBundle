<!DOCTYPE html>

<head>

<title>Delete redirect</title>

<body class="nowo-ui-page nowo-ui-routing-kit-panel" data-css-framework="custom" data-icon-set="none">

<header class="nowo-ui-confirm__header">

</header>
<div class="nowo-ui-confirm__body">
<p>Delete the redirect from /old-r1 to /new-r1? Visitors will get the regular response for that path again.</p>
</div>
<form-start name="" options="{&quot;action&quot;:&quot;\/_routing-kit\/redirects\/r1\/delete&quot;,&quot;method&quot;:&quot;POST&quot;,&quot;attr&quot;:{&quot;class&quot;:&quot;nowo-ui-confirm__footer nowo-ui-actions actions&quot;,&quot;data-testid&quot;:&quot;redirect-delete-form&quot;}}">
<form-rest name="">
<button type="submit" class="nowo-ui-btn nowo-ui-btn--danger">Delete</button>
<a class="nowo-ui-btn nowo-ui-btn--secondary" href="/_routing-kit/redirects">Cancel</a>
<form-end name="" options="{&quot;render_rest&quot;:false}">
</main>
</div>
</body>
