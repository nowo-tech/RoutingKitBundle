# Default configuration reference for RoutingKitBundle
nowo_routing_kit:
    enabled: true
    default_locale: en
    locales: [en, es, fr, de, it, pt, nl]
    # locale_provider: App\Locale\DatabaseLocaleProvider
    storage:
        paths_file: '%kernel.project_dir%/var/routing_kit/paths.json'
        # path_storage: App\Routing\DoctrineRoutePathStorage
    discovery:
        scan_dirs:
            - '%kernel.project_dir%/src/Controller'
    panel:
        allow_controller_override: false
        max_definitions: 500
        list_page_size: 50
        reject_conflicts: true
        # export_signing_key: '%env(ROUTING_KIT_EXPORT_KEY)%'  # min 32 chars when set; null → kernel.secret
    web_ui:
        enabled: true
        path_prefix: '/_routing'
        layout_template: ~        # null = nowo_ui_kit.layouts.admin (UiKit page contract)
        templates: {}             # index, form, redirects_index, redirects_form, redirects_delete
        import_display: modal     # modal (dialog from the Import action) | inline (card under the table)
        show_row_count: false     # the pagination summary already shows the count
        primary_action_last: false
    security:
        access_roles: [ROLE_ADMIN]
        allow_unauthenticated: false
    redirects:
        canonical_enabled: true
        canonical_status: 301
        canonical_cache_pool: cache.app
        root_enabled: false
        root_canonical_style: without_prefix
        root_home_path: /
        root_status: 302
    url_redirects:
        enabled: false   # opt-in operator redirects, panel at {path_prefix}/redirects (docs/REDIRECTS.md)
        # storage: App\Redirect\DoctrineUrlRedirectStorage
        file: '%kernel.project_dir%/var/routing_kit/redirects.json'
        cache_pool: cache.app
        cache_ttl: 3600
        # protected_prefixes: [/admin, /login, /logout, /register, /reset-password, /api, /health, /build, /bundles, /media, /.well-known]
        # protected_starts: ['/_', /robots.txt, /sitemap, /favicon]
        hits:
            enabled: true
            # message_bus: messenger.default_bus
    auto_invalidate_cache: true
    register_unprefixed_default: true
    seo_kit_bridge: true
